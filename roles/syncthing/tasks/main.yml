---
# jammy's universe repo only has syncthing 1.18.0, which predates the
# `generate` subcommand we rely on below. Add the official repo to get
# a current build instead (the board is reflashed often, so this can't
# just be a leftover manual apt source).
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: syncthing

- name: Fetch the official syncthing apt signing key
  ansible.builtin.get_url:
    url: https://syncthing.net/release-key.gpg
    dest: /etc/apt/keyrings/syncthing-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  tags: syncthing

- name: Add the official syncthing apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/syncthing.list
    content: "deb [signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing stable\n"
    owner: root
    group: root
    mode: "0644"
  tags: syncthing

- name: Install syncthing
  ansible.builtin.apt:
    name: syncthing
    state: present
    update_cache: true
  tags: syncthing

- name: Stop and mask the syncthing.service user unit
  ansible.builtin.systemd:
    name: syncthing.service
    scope: user
    state: stopped
    enabled: false
    masked: true
  tags: syncthing
  # The .deb package's postinst auto-enables a *user*-level
  # syncthing.service for root (via its login session) every time it's
  # (re)installed. It races our syncthing@root.service for port 8384 and
  # makes it crash-loop into "failed" — confirmed 2026-08-16. We run
  # syncthing as a system service instead, so this one always loses.

- name: Ensure the syncthing home directory exists
  ansible.builtin.file:
    path: "{{ syncthing_home_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: syncthing

- name: Generate syncthing config and GUI credentials (first run only)
  ansible.builtin.command:
    cmd: >-
      syncthing generate
      --home={{ syncthing_home_dir }}
      --gui-user={{ syncthing_gui_user }}
      --gui-password={{ syncthing_gui_password }}
      --no-default-folder
      --skip-port-probing
    creates: "{{ syncthing_home_dir }}/config.xml"
  tags: syncthing

# `--skip-port-probing` above guarantees the GUI address `generate` writes
# is always 127.0.0.1:8384, so this replace is a reliable, offline way to
# point it at syncthing_gui_address instead — no running instance needed.
# (Previously we did this via a systemd Environment=STGUIADDRESS override,
# but that only changes the runtime bind address, not config.xml, so the
# two silently drifted apart and broke `syncthing cli`, which reads the
# GUI address from config.xml. Confirmed 2026-08-16.)
- name: Point the GUI at the configured bind address
  ansible.builtin.replace:
    path: "{{ syncthing_home_dir }}/config.xml"
    regexp: '<address>127\.0\.0\.1:8384</address>'
    replace: "<address>{{ syncthing_gui_address }}</address>"
  notify: restart syncthing
  tags: syncthing

- name: Ensure the syncthing@root.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/syncthing@root.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: syncthing

- name: Point syncthing@root.service at our home dir
  ansible.builtin.copy:
    dest: /etc/systemd/system/syncthing@root.service.d/override.conf
    content: |
      [Service]
      Environment=STHOMEDIR={{ syncthing_home_dir }}
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart syncthing
  tags: syncthing

- name: Apply the drop-in now, before enabling the service below
  ansible.builtin.meta: flush_handlers

- name: Clear any stale failed/start-limit state from a previous run
  ansible.builtin.command: systemctl reset-failed syncthing@root.service
  changed_when: false
  failed_when: false
  tags: syncthing

- name: Enable and start syncthing@root.service
  ansible.builtin.systemd:
    name: syncthing@root.service
    enabled: true
    state: started
  tags: syncthing

- name: Ensure shared folder directories exist
  # /mnt/sdcard is vfat with fixed uid/gid/mode mount options
  # (see `mount`), so ownership/permissions can't be set per-directory.
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
  loop: "{{ syncthing_folders }}"
  loop_control:
    label: "{{ item.label }}"
  tags: syncthing

# The REST API (which `syncthing cli` talks to) is the only way to add
# folders without hand-editing config.xml, so this needs the service
# started above. It applies instantly — no restart required.
- name: List folder IDs already known to syncthing
  ansible.builtin.command: syncthing cli --home={{ syncthing_home_dir }} config folders list
  register: syncthing_existing_folders
  changed_when: false
  tags: syncthing

- name: Add shared folders that don't exist yet
  ansible.builtin.command:
    argv:
      - syncthing
      - cli
      - --home={{ syncthing_home_dir }}
      - config
      - folders
      - add
      - --id={{ item.id }}
      - --label={{ item.label }}
      - --path={{ item.path }}
      - --type=sendreceive
  loop: "{{ syncthing_folders }}"
  loop_control:
    label: "{{ item.label }}"
  when: item.id not in syncthing_existing_folders.stdout_lines
  tags: syncthing
