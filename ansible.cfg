[defaults]
inventory        = inventory/hosts.ini
retry_files_enabled = False
timeout          = 30
interpreter_python = auto_silent
stdout_callback  = yaml

# The board resets often, which means its SSH host key changes every time.
# Without this, every run after a reset fails with a host-key-mismatch error.
host_key_checking = False

[ssh_connection]
pipelining = True
