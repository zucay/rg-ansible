[embedded]
board1 ansible_host=192.168.0.40 ansible_port=22

[embedded:vars]
ansible_user=root
# Factory-default credentials. Password auth needs `sshpass` on the control
# node (apt install sshpass). Move this to ansible-vault once the device's
# password is no longer the factory default.
ansible_password=root
ansible_python_interpreter=/usr/bin/python3
